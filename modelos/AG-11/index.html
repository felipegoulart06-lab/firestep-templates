<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4b99">
  <title>Bem-Estar Norte | Agende um horário</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="top"><b>Bem-Estar Norte</b><span>Seg–sáb · 9h às 18h</span></header>
    <div id="work">
      <h1>O acompanhamento cabe na sua semana.</h1>
      <div class="people" id="people"></div>
      <h2>Antes de chegar</h2>
      <div class="services" id="services"></div>
      <h2>Depois de marcar</h2>
      <div class="days" id="days"></div>
      <h2>Horário</h2>
      <div class="slots" id="slots"></div>
      <form id="form" novalidate>
        <label>Nome<input id="name" autocomplete="name" placeholder="Seu nome"></label>
        <label>WhatsApp<input id="phone" inputmode="tel" autocomplete="tel" placeholder="(00) 00000-0000"></label>
        <button type="submit">Marcar com <span id="whoName">Ana</span></button>
        <p class="msg" id="msg" role="alert"></p>
      </form>
    </div>
    <section class="done" id="done" hidden aria-live="polite">
      <p>Cadeira reservada</p>
      <h2 id="doneTitle"></h2>
      <p id="doneMeta"></p>
      <button type="button" id="again">Marcar outra cadeira</button>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>
