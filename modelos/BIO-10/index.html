<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0e0e0e">
  <title>Consulta Ponto | Agende um horário</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,650&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header>
      <p class="kicker">Consulta Ponto</p>
      <h1>Escuta com dia e hora.</h1>
      <p class="status" id="status" aria-live="polite"><span class="dot"></span><span id="statusText">Qui a dom</span></p>
    </header>
    <div class="squares" aria-label="Fotos">
      <img src="https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=600&q=80" alt="Imagem do atendimento">
      <img src="https://images.unsplash.com/photo-1522337660859-02fbefca4702?auto=format&fit=crop&w=600&q=80" alt="Escuta">
      <img src="https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&w=600&q=80" alt="Retrato.">
    </div>
    <nav class="list" aria-label="Links">
      <a href="https://wa.me/5547999999999?text=Ola%2C%20quero%20agendar" target="_blank" rel="noopener noreferrer"><img src="https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?auto=format&fit=crop&w=200&q=80" alt=""><span><strong>Agendar</strong><small>WhatsApp</small></span><b>→</b></a>
      <a href="https://wa.me/5547999999999?text=Ola%2C%20quero%20agendar" target="_blank" rel="noopener noreferrer"><img src="https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=200&q=80" alt=""><span><strong>Avaliação</strong><small>R$ 180</small></span><b>→</b></a>
      <a href="https://instagram.com/noirsalon" target="_blank" rel="noopener noreferrer"><img src="https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&w=200&q=80" alt=""><span><strong>Instagram</strong><small>@noirsalon</small></span><b>→</b></a>
      <a href="https://www.google.com/maps/search/?api=1&query=Rua%20Escura%207" target="_blank" rel="noopener noreferrer"><img src="https://images.unsplash.com/photo-1522337660859-02fbefca4702?auto=format&fit=crop&w=200&q=80" alt=""><span><strong>Endereço</strong><small>Rua Escura, 7</small></span><b>→</b></a>
    </nav>
    <div class="actions">
      <button type="button" id="copyAddress" data-copy="Rua Escura, 7">Copiar endereço</button>
      <button type="button" id="share">Compartilhar</button>
    </div>
    <footer><p>© <span id="year">2026</span> Consulta Ponto</p></footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
