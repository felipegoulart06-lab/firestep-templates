<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f5f4">
  <title>Cadeira Livre | Agende seu horário</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header>
      <p class="kicker">Cadeira Livre Studio</p>
      <h1>Marque a próxima tesoura.</h1>
      <p class="status" id="status" aria-live="polite"><span class="dot"></span><span id="statusText">Noite</span></p>
    </header>
    <section class="stack" aria-roledescription="carrossel">
      <article class="biz">
        <img src="https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=400&q=80" alt="">
        <div><p>Cadeira Livre Studio</p><strong>Agendar</strong><a href="https://wa.me/5547999999999?text=Ola%2C%20quero%20agendar" target="_blank" rel="noopener noreferrer">WhatsApp</a></div>
      </article>
      <article class="biz" hidden>
        <img src="https://images.unsplash.com/photo-1522337660859-02fbefca4702?auto=format&fit=crop&w=400&q=80" alt="">
        <div><p>Serviço</p><strong>Corte · R$ 140</strong><a href="https://wa.me/5547999999999?text=Ola%2C%20quero%20agendar" target="_blank" rel="noopener noreferrer">Reservar</a></div>
      </article>
      <article class="biz" hidden>
        <img src="https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&w=400&q=80" alt="">
        <div><p>Rede</p><strong>Instagram</strong><a href="https://instagram.com/cartao.studio" target="_blank" rel="noopener noreferrer">@cartao.studio</a></div>
      </article>
      <article class="biz" hidden>
        <img src="https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?auto=format&fit=crop&w=400&q=80" alt="">
        <div><p>Endereço</p><strong>Rua do Cartão, 45</strong><a href="https://www.google.com/maps/search/?api=1&query=Rua%20do%20Cartao%2045" target="_blank" rel="noopener noreferrer">Como chegar</a></div>
      </article>
      <div class="controls">
        <button type="button" id="prev">Anterior</button>
        <p id="count">1 / 4</p>
        <button type="button" id="next">Próximo</button>
      </div>
    </section>
    <div class="actions">
      <button type="button" id="copyAddress" data-copy="Rua do Cartão, 45">Copiar endereço</button>
      <button type="button" id="share">Compartilhar</button>
    </div>
    <footer><p>© <span id="year">2026</span> Cadeira Livre</p></footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
