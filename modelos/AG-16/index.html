<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7c3aed">
  <title>Fisio do Dia | Agende um horário</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header><p>Fisio do Dia pela duração</p><h1>Sua sessão de fisioterapia, no horário certo.</h1></header>
    <div id="work">
      <div class="services" id="services"></div>
      <div class="pager">
        <button type="button" id="prev" aria-label="Dia anterior">‹</button>
        <strong id="dayTitle"></strong>
        <button type="button" id="next" aria-label="Próximo dia">›</button>
      </div>
      <div class="slots" id="slots"></div>
      <form id="form" novalidate>
        <label>Nome<input id="name" autocomplete="name" placeholder="Seu nome"></label>
        <label>WhatsApp<input id="phone" inputmode="tel" autocomplete="tel" placeholder="(00) 00000-0000"></label>
        <button type="submit">Encaixar horário</button>
        <p class="msg" id="msg" role="alert"></p>
      </form>
    </div>
    <section class="done" id="done" hidden aria-live="polite">
      <p>Fisio do Dia confirmado</p>
      <h2 id="doneTitle"></h2>
      <p id="doneMeta"></p>
      <button type="button" id="again">Novo Fisio do Dia</button>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>
