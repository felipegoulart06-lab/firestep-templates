<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#365314">
  <title>Movimento Claro | Agende um horário</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header><p>Próximos 14 dias</p><h1>Há um horário para o seu movimento.</h1></header>
    <div id="work">
      <div class="services" id="services"></div>
      <div class="cards" id="cards"></div>
      <h2 id="slotTitle">O que a sessão pede</h2>
      <div class="slots" id="slots"></div>
      <form id="form" novalidate>
        <label>Nome<input id="name" autocomplete="name" placeholder="Seu nome"></label>
        <label>WhatsApp<input id="phone" inputmode="tel" autocomplete="tel" placeholder="(00) 00000-0000"></label>
        <button type="submit">Marcar neste dia</button>
        <p class="msg" id="msg" role="alert"></p>
      </form>
    </div>
    <section class="done" id="done" hidden aria-live="polite">
      <p>Dia marcado</p>
      <h2 id="doneTitle"></h2>
      <p id="doneMeta"></p>
      <button type="button" id="again">Escolher outro dia</button>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>
