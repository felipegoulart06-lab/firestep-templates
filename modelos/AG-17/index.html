<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e7490">
  <title>Recupera | Agende um horário</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="kiosk" id="work">
    <header><b>Recupera</b><span>Toque para marcar · todos os dias 10h–19h</span></header>
    <h1>Marque a próxima sessão.</h1>
    <div class="services" id="services"></div>
    <h2>Dia</h2>
    <div class="days" id="days"></div>
    <h2>Horário</h2>
    <div class="slots" id="slots"></div>
    <form id="form" novalidate>
      <label>Seu nome<input id="name" autocomplete="name" placeholder="Nome"></label>
      <label>WhatsApp<input id="phone" inputmode="tel" autocomplete="tel" placeholder="(00) 00000-0000"></label>
      <button type="submit">Confirmar no quiosque</button>
      <p class="msg" id="msg" role="alert"></p>
    </form>
  </div>
  <section class="ticket" id="done" hidden aria-live="polite">
    <p>SENHA CONFIRMADA</p>
    <strong id="doneCode"></strong>
    <h2 id="doneTitle"></h2>
    <p id="doneMeta"></p>
    <button type="button" id="again">Nova marcação</button>
  </section>
  <script src="script.js"></script>
</body>
</html>
