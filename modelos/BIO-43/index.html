<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e7f0df">
  <title>Salão Hora | Agende seu horário</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@500;800&family=Fraunces:opsz,wght@9..144,560&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header>
      <p class="kicker">Mapa de bolso</p>
      <h1>Seu corte, no horário marcado.</h1>
      <p class="status" id="status" aria-live="polite"><span class="dot"></span><span id="statusText">Sex e sáb</span></p>
    </header>
    <div class="map" aria-hidden="true">
      <span class="road h"></span>
      <span class="road v"></span>
    </div>
    <nav class="pins" aria-label="Pontos">
      <a href="https://wa.me/5547999999999?text=Ola%2C%20quero%20agendar" target="_blank" rel="noopener noreferrer">
        <img src="https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=200&q=80" alt=""><span><strong>Agenda</strong><small>esquina norte</small></span>
      </a>
      <a href="https://wa.me/5547999999999?text=Ola%2C%20quero%20agendar" target="_blank" rel="noopener noreferrer">
        <img src="https://images.unsplash.com/photo-1522337660859-02fbefca4702?auto=format&fit=crop&w=200&q=80" alt=""><span><strong>Escova</strong><small>R$ 140</small></span>
      </a>
      <a href="https://instagram.com/bairro.studio" target="_blank" rel="noopener noreferrer">
        <img src="https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&w=200&q=80" alt=""><span><strong>Instagram</strong><small>@bairro.studio</small></span>
      </a>
      <a href="https://www.google.com/maps/search/?api=1&query=Rua%20do%20Bairro%2043" target="_blank" rel="noopener noreferrer">
        <img src="https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?auto=format&fit=crop&w=200&q=80" alt=""><span><strong>Chegar</strong><small>Rua do Bairro, 43</small></span>
      </a>
    </nav>
    <div class="actions">
      <button type="button" id="copyAddress" data-copy="Rua do Bairro, 43">Copiar endereço</button>
      <button type="button" id="share">Compartilhar</button>
    </div>
    <footer><p>© <span id="year">2026</span> Mechas</p></footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
