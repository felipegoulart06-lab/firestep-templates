<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#be185d">
  <title>Espaço Terapêutico | Agende um horário</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="split">
    <article class="slip" id="slip">
      <p class="code">FICHA 13</p>
      <h1>Escolha o dia da sua sessão.</h1>
      <dl>
        <div><dt>Serviço</dt><dd id="sSvc">—</dd></div>
        <div><dt>Quando</dt><dd id="sWhen">—</dd></div>
        <div><dt>Valor</dt><dd id="sPrice">—</dd></div>
        <div><dt>Cliente</dt><dd id="sWho">—</dd></div>
      </dl>
      <p class="note">Qua–dom · 12h às 20h</p>
    </article>
    <div class="controls" id="work">
      <div class="services" id="services"></div>
      <div class="cal-nav"><button type="button" id="prev" aria-label="Mês anterior">‹</button><strong id="month"></strong><button type="button" id="next" aria-label="Próximo mês">›</button></div>
      <div class="wds" aria-hidden="true"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div>
      <div class="days" id="days"></div>
      <div class="slots" id="slots"></div>
      <form id="form" novalidate>
        <label>Nome<input id="name" autocomplete="name" placeholder="Nome na ficha"></label>
        <label>WhatsApp<input id="phone" inputmode="tel" autocomplete="tel" placeholder="(00) 00000-0000"></label>
        <button type="submit">Registrar ficha</button>
        <p class="msg" id="msg" role="alert"></p>
      </form>
    </div>
  </div>
  <section class="done" id="done" hidden aria-live="polite">
    <p>Ficha registrada</p>
    <h2 id="doneTitle"></h2>
    <p id="doneMeta"></p>
    <button type="button" id="again">Nova ficha</button>
  </section>
  <script src="script.js"></script>
</body>
</html>
