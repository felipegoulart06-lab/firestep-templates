<!DOCTYPE html>

<head>

      <nav class="steps" aria-label="Links">
        <a href="https://wa.me/5547999999999?text=Ola%2C%20quero%20agendar" target="_blank" rel="noopener noreferrer">1. Chamar no WhatsApp</a>
