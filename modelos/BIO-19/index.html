<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8e6ea">
  <title>Estúdio da Manhã | Agende um horário</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Mulish:wght@400;650;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header>
      <p class="kicker">Estúdio da Manhã</p>
      <h1>Um horário só para o seu cuidado.</h1>
      <p class="status" id="status" aria-live="polite"><span class="dot"></span><span id="statusText">Ter a sáb</span></p>
    </header>
    <section class="stage" id="stage">
      <img src="https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?auto=format&fit=crop&w=1200&q=80" alt="Imagem do atendimento">
      <div class="curtain left" aria-hidden="true"></div>
      <div class="curtain right" aria-hidden="true"></div>
      <button type="button" class="open-btn" id="openCurtain" aria-expanded="false" aria-controls="stage">Abrir cortina</button>
    </section>
    <nav class="links" aria-label="Links">
      <a href="https://wa.me/5547999999999?text=Ola%2C%20quero%20agendar" target="_blank" rel="noopener noreferrer">
        <img src="https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=200&q=80" alt="">
        <span><strong>Agendar</strong><small>WhatsApp</small></span>
      </a>
      <a href="https://wa.me/5547999999999?text=Ola%2C%20quero%20agendar" target="_blank" rel="noopener noreferrer">
        <img src="https://images.unsplash.com/photo-1522337660859-02fbefca4702?auto=format&fit=crop&w=200&q=80" alt="">
        <span><strong>Massagem</strong><small>R$ 90</small></span>
      </a>
      <a href="https://instagram.com/veu.studio" target="_blank" rel="noopener noreferrer">
        <img src="https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&w=200&q=80" alt="">
        <span><strong>Instagram</strong><small>@veu.studio</small></span>
      </a>
      <a href="https://www.google.com/maps/search/?api=1&query=Rua%20do%20Veu%2019" target="_blank" rel="noopener noreferrer">
        <img src="https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?auto=format&fit=crop&w=200&q=80" alt="">
        <span><strong>Como chegar</strong><small>Rua do Véu, 19</small></span>
      </a>
    </nav>
    <div class="actions">
      <button type="button" id="copyAddress" data-copy="Rua do Véu, 19">Copiar endereço</button>
      <button type="button" id="share">Compartilhar</button>
    </div>
    <footer><p>© <span id="year">2026</span> Estúdio da Manhã</p></footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
