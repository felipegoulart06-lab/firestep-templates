<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#d7dde3">
  <title>Fisio Ponto | Agende um horário</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&family=Manrope:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header>
      <p class="kicker">Studio Fisio Ponto</p>
      <h1>Recupere o movimento com hora marcada.</h1>
      <p class="status" id="status" aria-live="polite"><span class="dot"></span><span id="statusText">Sábado</span></p>
    </header>
    <section class="panel">
      <div class="screen">
        <p id="screenTitle">Térreo · Agenda</p>
        <a id="screenLink" href="https://wa.me/5547999999999?text=Ola%2C%20quero%20agendar" target="_blank" rel="noopener noreferrer">Chamar o térreo</a>
      </div>
      <div class="floors" role="group" aria-label="Fisio Pontoes">
        <button type="button" class="floor" aria-pressed="true" data-title="Térreo · Agenda" data-cta="Chamar o térreo" data-href="https://wa.me/5547999999999?text=Ol%C3%A1!%20Quero%20agendar%20no%20Andar.">
          <img src="https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=200&q=80" alt="">0
        </button>
        <button type="button" class="floor" aria-pressed="false" data-title="1 · Corte" data-cta="Subir para o corte" data-href="https://wa.me/5547999999999?text=Ol%C3%A1!%20Quero%20corte%20no%20Andar.">
          <img src="https://images.unsplash.com/photo-1522337660859-02fbefca4702?auto=format&fit=crop&w=200&q=80" alt="">1
        </button>
        <button type="button" class="floor" aria-pressed="false" data-title="2 · Instagram" data-cta="Abrir Instagram" data-href="https://instagram.com/andar.studio">
          <img src="https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&w=200&q=80" alt="">2
        </button>
        <button type="button" class="floor" aria-pressed="false" data-title="3 · Rua do Andar, 31" data-cta="Como chegar" data-href="https://www.google.com/maps/search/?api=1&query=Rua%20do%20Andar%2031">
          <img src="https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?auto=format&fit=crop&w=200&q=80" alt="">3
        </button>
      </div>
    </section>
    <div class="actions">
      <button type="button" id="copyAddress" data-copy="Rua do Andar, 31">Copiar endereço</button>
      <button type="button" id="share">Compartilhar</button>
    </div>
    <footer><p>© <span id="year">2026</span> Fisio Ponto</p></footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
