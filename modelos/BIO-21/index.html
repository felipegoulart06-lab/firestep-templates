<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101624">
  <title>Passo Terapêutico | Agende um horário</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Jost:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header>
      <p class="kicker">Passo Terapêutico Studio</p>
      <h1>Marque o próximo encontro.</h1>
      <p class="status" id="status" aria-live="polite"><span class="dot"></span><span id="statusText">Qui a dom</span></p>
    </header>
    <section class="sky" id="sky" aria-label="Constelação de links">
      <svg aria-hidden="true"></svg>
      <a class="star" href="https://wa.me/5547999999999?text=Ola%2C%20quero%20agendar" target="_blank" rel="noopener noreferrer">
        <img src="https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=400&q=80" alt="">
        <span>Agendar</span>
      </a>
      <a class="star" href="https://wa.me/5547999999999?text=Ola%2C%20quero%20agendar" target="_blank" rel="noopener noreferrer">
        <img src="https://images.unsplash.com/photo-1522337660859-02fbefca4702?auto=format&fit=crop&w=400&q=80" alt="">
        <span>Corte · R$ 150</span>
      </a>
      <a class="star" href="https://instagram.com/estrelastudio" target="_blank" rel="noopener noreferrer">
        <img src="https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&w=400&q=80" alt="">
        <span>Instagram</span>
      </a>
      <a class="star" href="https://www.google.com/maps/search/?api=1&query=Rua%20da%20Estrela%2021" target="_blank" rel="noopener noreferrer">
        <img src="https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?auto=format&fit=crop&w=400&q=80" alt="">
        <span>Como chegar</span>
      </a>
    </section>
    <p class="hint">Rua da Estrela, 21 · as linhas ligam o caminho.</p>
    <div class="actions">
      <button type="button" id="copyAddress" data-copy="Rua da Estrela, 21">Copiar endereço</button>
      <button type="button" id="share">Compartilhar</button>
    </div>
    <footer><p>© <span id="year">2026</span> Passo Terapêutico</p></footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
