<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#efe4d4">
  <title>Sala do Ritmo | Agende um horário</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@500;700&family=Fraunces:opsz,wght@9..144,560&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header>
      <p class="kicker">Sala do Ritmo Studio</p>
      <h1>Uma sessão para o seu bem-estar.</h1>
      <p class="status" id="status" aria-live="polite"><span class="dot"></span><span id="statusText">Ter a sáb</span></p>
    </header>
    <section class="chest" aria-label="Sala do Ritmos">
      <article class="drawer">
        <button type="button" class="face" aria-expanded="true">Agenda <i aria-hidden="true"></i></button>
        <div class="inside">
          <img src="https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=400&q=80" alt="">
          <p>Hora marcada pelo WhatsApp.</p>
          <a href="https://wa.me/5547999999999?text=Ola%2C%20quero%20agendar" target="_blank" rel="noopener noreferrer">Abrir agenda</a>
        </div>
      </article>
      <article class="drawer">
        <button type="button" class="face" aria-expanded="false">Cuidado <i aria-hidden="true"></i></button>
        <div class="inside" hidden>
          <img src="https://images.unsplash.com/photo-1522337660859-02fbefca4702?auto=format&fit=crop&w=400&q=80" alt="">
          <p>45 min · R$ 140, com consultoria.</p>
          <a href="https://wa.me/5547999999999?text=Ola%2C%20quero%20agendar" target="_blank" rel="noopener noreferrer">Retorno</a>
        </div>
      </article>
      <article class="drawer">
        <button type="button" class="face" aria-expanded="false">Instagram <i aria-hidden="true"></i></button>
        <div class="inside" hidden>
          <img src="https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&w=400&q=80" alt="">
          <p>O trabalho do dia em @Sala do Ritmo.studio.</p>
          <a href="https://instagram.com/gaveta.studio" target="_blank" rel="noopener noreferrer">Ver perfil</a>
        </div>
      </article>
      <article class="drawer">
        <button type="button" class="face" aria-expanded="false">Mapa <i aria-hidden="true"></i></button>
        <div class="inside" hidden>
          <img src="https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?auto=format&fit=crop&w=400&q=80" alt="">
          <p>Rua da Gaveta, 27 · Centro.</p>
          <a href="https://www.google.com/maps/search/?api=1&query=Rua%20da%20Gaveta%2027" target="_blank" rel="noopener noreferrer">Como chegar</a>
        </div>
      </article>
    </section>
    <div class="actions">
      <button type="button" id="copyAddress" data-copy="Rua da Gaveta, 27">Copiar endereço</button>
      <button type="button" id="share">Compartilhar</button>
    </div>
    <footer><p>© <span id="year">2026</span> Sala do Ritmo</p></footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
