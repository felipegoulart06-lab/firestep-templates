<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6e7c8">
  <title>Cuidado Íntegro | Agende um horário</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header>
      <p class="kicker">Cuidado Íntegro</p>
      <h1>Peeling</h1>
      <p class="status" id="status" aria-live="polite"><span class="dot"></span><span id="statusText">Seg a sáb</span></p>
    </header>
    <div class="dial" aria-label="Atalhos em volta do retrato">
      <a class="mark n" href="https://wa.me/5547999999999?text=Ola%2C%20quero%20agendar" target="_blank" rel="noopener noreferrer">
        <img src="https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=200&q=80" alt="">
        <span>Agenda</span>
      </a>
      <a class="mark e" href="https://instagram.com/solario.studio" target="_blank" rel="noopener noreferrer">
        <img src="https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&w=200&q=80" alt="">
        <span>Insta</span>
      </a>
      <a class="mark s" href="https://www.google.com/maps/search/?api=1&query=Rua%20do%20Sol%2018" target="_blank" rel="noopener noreferrer">
        <img src="https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?auto=format&fit=crop&w=200&q=80" alt="">
        <span>Mapa</span>
      </a>
      <a class="mark w" href="https://wa.me/5547999999999?text=Ola%2C%20quero%20agendar" target="_blank" rel="noopener noreferrer">
        <img src="https://images.unsplash.com/photo-1522337660859-02fbefca4702?auto=format&fit=crop&w=200&q=80" alt="">
        <span>Protocolo</span>
      </a>
      <div class="core">
        <img src="https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&w=600&q=80" alt="Retrato do Cuidado Íntegro.">
      </div>
    </div>
    <p class="hint">Um procedimento por horário. Combinar dois pede outra reserva.</p>
    <div class="actions">
      <button type="button" id="copyAddress" data-copy="Rua do Sol, 18">Copiar endereço</button>
      <button type="button" id="share">Compartilhar</button>
    </div>
    <footer><p>© <span id="year">2026</span> Cuidado Íntegro</p></footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
