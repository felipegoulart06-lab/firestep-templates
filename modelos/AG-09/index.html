<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f6e6e">
  <title>Cuidado Rosa | Agende um horário</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#week">Ir para a grade</a>
  <div class="app">
    <header class="top">
      <div><p class="eyebrow">Grade da semana</p><h1>Sua pele, no horário combinado.</h1></div>
      <p class="hours">Seg–sex 10h–18h · sáb 9h–13h</p>
    </header>
    <div class="work" id="work">
      <div class="services" id="services" role="radiogroup" aria-label="Serviço"></div>
      <div class="switch" id="switch" aria-label="Dia"></div>
      <div class="week" id="week"></div>
      <form id="form" novalidate>
        <label>Nome<input id="name" autocomplete="name" placeholder="Seu nome"></label>
        <label>WhatsApp<input id="phone" inputmode="tel" autocomplete="tel" placeholder="(00) 00000-0000"></label>
        <label>Observação <span>(opcional)</span><input id="notes" placeholder="Alguma preferência?"></label>
        <div class="end">
          <p id="sum">Toque em um horário da grade</p>
          <button type="submit">Confirmar horário</button>
        </div>
        <p class="msg" id="msg" role="alert"></p>
      </form>
    </div>
    <section class="done" id="done" hidden aria-live="polite">
      <p class="eyebrow">Na grade</p>
      <h2 id="doneTitle"></h2>
      <p id="doneWhen"></p>
      <p id="doneWho"></p>
      <button type="button" id="again">Limpar e marcar outro</button>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>
