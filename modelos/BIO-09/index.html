<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8eef1">
  <title>Escuta Breve | Agende um horário</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header>
      <p class="kicker">Encontro</p>

    </header>
    <section class="stack" aria-label="Edições">
      <a class="card" href="https://wa.me/5547999999999?text=Ola%2C%20quero%20agendar" target="_blank" rel="noopener noreferrer">
        <img src="https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&w=1000&q=80" alt="Retrato da Escuta Breve.">
        <span class="body"><small>Edição 01</small><strong>Agendar um horário</strong><em>WhatsApp</em></span>
      </a>
      <a class="card" href="https://wa.me/5547999999999?text=Ola%2C%20quero%20agendar" target="_blank" rel="noopener noreferrer">
        <img src="https://images.unsplash.com/photo-1522337660859-02fbefca4702?auto=format&fit=crop&w=1000&q=80" alt="Avaliação">
        <span class="body"><small>Edição 02 · R$ 180</small><strong>Consulta</strong><em>50 min</em></span>
      </a>
      <a class="card" href="https://wa.me/5547999999999?text=Ola%2C%20quero%20agendar" target="_blank" rel="noopener noreferrer">
        <img src="https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=1000&q=80" alt="Imagem do atendimento">
        <span class="body"><small>Edição 03 · R$ 140</small><strong>Escuta</strong><em>45 min</em></span>
      </a>
      <a class="card" href="https://instagram.com/petala.studio" target="_blank" rel="noopener noreferrer">
        <img src="https://images.unsplash.com/photo-1521590832167-7bcbfaa6381f?auto=format&fit=crop&w=1000&q=80" alt="Ambiente do estúdio.">
        <span class="body"><small>@petala.studio</small><strong>Ver o Instagram</strong><em>Fotos novas</em></span>
      </a>
    </section>
    <div class="actions">
      <button type="button" id="copyAddress" data-copy="Rua das Pétalas, 9">Copiar endereço</button>
      <button type="button" id="share">Compartilhar</button>
    </div>
    <footer><p>© <span id="year">2026</span> Escuta Breve</p></footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
