<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Detalhes do template — firestep TEMPLATES">
  <title>firestep TEMPLATES — Detalhes</title>
  <meta name="robots" content="index,follow">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#1b365d">
  <link rel="stylesheet" href="style.css?v=20260916e">
</head>
<body data-page="template">
  <header class="topbar">
    <a class="brand" href="index.html">
      <div>
        <strong>firestep TEMPLATES</strong>
        <small>Catálogo de plataformas</small>
      </div>
    </a>
    <a class="btn btn-outline" href="index.html">Voltar ao catálogo</a>
  </header>

  <main id="templateDetailRoot" class="product-page container">
    <div class="empty">
      <strong>Carregando template...</strong>
    </div>
  </main>

  <div id="interestModal" class="details-modal" hidden>
    <div class="details-backdrop" data-close-interest></div>
    <aside class="details-panel interest-panel" role="dialog" aria-modal="true" aria-labelledby="interestTitle">
      <header class="details-head">
        <div>
          <span class="eyebrow">TENHO INTERESSE</span>
          <h2 id="interestTitle">Fale com a equipe</h2>
          <p class="interest-template">Template: <strong id="interestTemplateName">—</strong></p>
        </div>
        <button class="btn btn-outline btn-small" type="button" data-close-interest aria-label="Fechar">Fechar</button>
      </header>
      <form id="interestForm" class="form interest-form">
        <input id="interestTemplateId" type="hidden">
        <label>
          Nome completo *
          <input id="interestName" name="nomeCompleto" type="text" autocomplete="name" required placeholder="Seu nome completo">
        </label>
        <label>
          WhatsApp *
          <input id="interestWhatsapp" name="whatsapp" type="tel" inputmode="tel" autocomplete="tel" required placeholder="(47) 99999-9999">
        </label>
        <label>
          E-mail *
          <input id="interestEmail" name="email" type="email" autocomplete="email" required placeholder="voce@email.com">
        </label>
        <button id="interestSubmit" class="btn btn-primary btn-full" type="submit">Enviar</button>
      </form>
    </aside>
  </div>

  <script src="config.js?v=20260916e"></script>
  <script src="seed-data.js?v=20260916e"></script>
  <script src="script.js?v=20260916e"></script>
</body>
</html>
